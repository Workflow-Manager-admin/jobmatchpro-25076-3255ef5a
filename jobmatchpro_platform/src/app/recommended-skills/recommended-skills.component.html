<div class="skills-list">
  <h3>Recommended Skills</h3>
  <div class="skill-chips">
    <span class="chip" *ngFor="let skill of skills">
      <span class="icon">{{skill.icon}}</span>{{skill.name}}
    </span>
  </div>
  <div style="margin-top:15px;">
    <a href="#" class="cta-link">See more skill suggestions</a>
  </div>
</div>
